trigger:
  branches:
    include:
      - master
      - develop
      - main
      - release*
  tags:
    include:
      - '*'

pr: none

parameters:
  - name: branch_name
    displayName: Branch to build from
    type: string
    default: develop

  - name: build_arm
    displayName: Build ARM images
    type: boolean
    default: false

variables:
- group: qa-secrets

- name: DOCKERHUB_ACCOUNT
  value: $(DOCKERHUB-ACCOUNT)

- name: DOCKERHUB_REPO
  value: $(DOCKERHUB-REPO)

stages:

# =========================================================
# BUILD STAGE
# =========================================================
- stage: Build
  displayName: Build and Push Images

  jobs:

    # =====================================================
    # AMD64 BUILD
    # =====================================================
    - job: Build_AMD64
      displayName: Build AMD64 Image

      pool:
        name: TUV-Prod-Agents

      steps:
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - script: |
            sudo apt-get update

            sudo apt-get install -y docker.io

            sudo systemctl start docker

            sudo systemctl enable docker

            sudo usermod -aG docker

            sudo chmod 666 /var/run/docker.sock

            sudo systemctl restrt docker

            docker --version

            docker ps

            docker pull node:22-alpine
          displayName: Install and configure Docker

        # - script: |
        #     git fetch --tags origin
        #   displayName: Get tags

        - task: Docker@2
          displayName: Login to DockerHub
          inputs:
            command: login
            containerRegistry: 'tuvmgtprodaueaimagesacr'
        - script: |
            GIT_HASH=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=7 HEAD)

            echo "Git Hash: $GIT_HASH"

            echo "##vso[task.setvariable variable=VERSION_COMMON;isOutput=true]$GIT_HASH"
            echo "##vso[task.setvariable variable=VERSION;isOutput=true]${GIT_HASH}-amd64"
          name: country_config
          displayName: Generate Image Tags
        
        - task: Docker@2
          displayName: Build and Push countryconfig image
          inputs:
            command: buildAndPush
            repository: $(DOCKERHUB_ACCOUNT)/$(DOCKERHUB_REPO)
            Dockerfile: Dockerfile
            buildContext: .
            tags: |
              $(country_config.VERSION)

        - script: |
            mkdir -p ~/.docker/cli-plugins

            curl -SL https://github.com/docker/buildx/releases/latest/download/buildx-linux-amd64 \
              -o ~/.docker/cli-plugins/docker-buildx

            chmod +x ~/.docker/cli-plugins/docker-buildx

            docker buildx version
          displayName: Install Docker Buildx

        - task: Docker@2
          displayName: Build and Push assets image
          env:
            DOCKER_BUILDKIT: 1
          inputs:
            command: buildAndPush
            repository: $(DOCKERHUB_ACCOUNT)/$(DOCKERHUB_REPO)
            Dockerfile: Dockerfile.assets
            buildContext: .
            tags: |
              $(country_config.VERSION)-assets

    # =====================================================
    # ARM64 BUILD
    # =====================================================
    - ${{ if eq(parameters.build_arm, true) }}:
      - job: Build_ARM64
        displayName: Build ARM64 Image

        pool:
          name: TUV-Prod-Agents

        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              git fetch --tags origin
            displayName: Get tags

          - task: Docker@2
            displayName: Login to DockerHub
            inputs:
              command: login
              containerRegistry: tuvmgtprodaueaimagesacr

          - script: |
              GIT_HASH=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short=7 HEAD)

              echo "Git Hash: $GIT_HASH"

              echo "##vso[task.setvariable variable=VERSION_COMMON;isOutput=true]$GIT_HASH"
              echo "##vso[task.setvariable variable=VERSION;isOutput=true]${GIT_HASH}-arm64"
            name: country_config
            displayName: Generate Image Tags

          - task: Docker@2
            displayName: Build and Push ARM countryconfig image
            inputs:
              command: buildAndPush
              repository: $(DOCKERHUB_ACCOUNT)/$(DOCKERHUB_REPO)
              Dockerfile: Dockerfile
              buildContext: .
              tags: |
                $(country_config.VERSION)

          - task: Docker@2
            displayName: Build and Push ARM assets image
            inputs:
              command: buildAndPush
              repository: $(DOCKERHUB_ACCOUNT)/$(DOCKERHUB_REPO)
              Dockerfile: Dockerfile.assets
              buildContext: .
              tags: |
                $(country_config.VERSION)-assets

# =========================================================
# MERGE MANIFEST STAGE
# =========================================================
- stage: MergeManifest
  displayName: Merge Multi-Arch Manifest
  dependsOn: Build

  jobs:
    - job: Merge
      displayName: Create Docker Manifest

      pool:
        name: TUV-Prod-Agents

      variables:
        VERSION_COMMON: $[ stageDependencies.Build.Build_AMD64.outputs['country_config.VERSION_COMMON'] ]

      steps:
        - task: Docker@2
          displayName: Login to DockerHub
          inputs:
            command: login
            containerRegistry: tuvmgtprodaueaimagesacr

        - script: |
            TAG=$(VERSION_COMMON)
            REPO="$(DOCKERHUB_ACCOUNT)/$(DOCKERHUB_REPO)"

            echo "Using tag: $TAG"

            if [ "${{ parameters.build_arm }}" = "true" ]; then
              MANIFEST_LIST="$REPO:$TAG-amd64 $REPO:$TAG-arm64"
              ASSETS_MANIFEST_LIST="$REPO:$TAG-amd64-assets $REPO:$TAG-arm64-assets"
            else
              MANIFEST_LIST="$REPO:$TAG-amd64"
              ASSETS_MANIFEST_LIST="$REPO:$TAG-amd64-assets"
            fi

            echo "Creating manifest: $REPO:$TAG"

            docker manifest create $REPO:$TAG \
              $MANIFEST_LIST

            docker manifest push $REPO:$TAG

            echo "Creating assets manifest: $REPO:$TAG-assets"

            docker manifest create $REPO:$TAG-assets \
              $ASSETS_MANIFEST_LIST

            docker manifest push $REPO:$TAG-assets
          displayName: Create and Push Multi-Arch Manifest