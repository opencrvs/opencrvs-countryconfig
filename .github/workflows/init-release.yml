# Gitflow release initialisation workflow. Dispatched by opencrvs-core's
# init-release (or run manually) with a semver version.
#
# What it does:
#   1. Base branch: release/<x>.<y>.<z-1> for a patch, develop for a minor/major.
#   2. Creates release/<version> from it.
#   3. Bumps package.json, prepends a CHANGELOG section, pushes both commits.
#   4. Opens the PRs, both already carrying those commits:
#        release/<version> -> master, only when the release is on the channel
#        master tracks
#        merge-back/... -> develop, or -> the release branch one channel up for
#        an older channel — which then gets no PR to master at all, because it
#        reaches master and develop through that branch.
#      Core resolves which one and passes it in as target_branch; this repo
#      never derives it.
#   5. Creates a draft release, then deletes its tag. The real tag is cut by
#      hand once the release ships.
#
# TODO: this repo only cuts release branches on the 1.9.x line. Remove this
# workflow, and the PRs it opens, once this branch reaches develop.
name: Release - Start a new release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'
      target_branch:
        type: string
        required: false
        default: 'master'
        description: 'Branch this release merges into, passed down by opencrvs-core. master for the current channel, or the release branch one channel up (e.g. release/2.0.2) for an older one.'

jobs:
  release_workflow:
    runs-on: ubuntu-latest
    steps:
      # Base branch from the version: patch -> release/<x>.<y>.<z-1>,
      # minor/major -> develop.
      - name: Determine the Base Branch
        id: get_base_branch
        run: |
          version="${{ inputs.version }}"

          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version was provided as input: $version" >&2
            echo "Please follow semver format for versioning, e/g 1.7.2"
            exit 1
          fi

          IFS='.' read -r x y z <<< "$version"
          if [ "$z" = "0" ]; then
            base_branch="develop"
          else
            previous_version="$((x)).$((y)).$((z-1))"
            base_branch="release/$previous_version"
          fi
          # Core passes the target down: it is the one repo that knows which
          # channel master tracks. This repo's own version files and branch
          # history are not a reliable signal, so it never re-derives it.
          #   master      -> current channel: release PR to master + merge-back
          #                  PR to develop.
          #   release/<v> -> older channel: no release PR, just a merge-back
          #                  into that branch, which carries it onwards.
          target_branch="${{ inputs.target_branch }}"
          if [ -z "$target_branch" ]; then
            target_branch="master"
          fi

          # Current channel merges back into develop; an older one merges into
          # its target. Every step below reads off this one value.
          if [ "$target_branch" = "master" ]; then
            merge_back_target="develop"
          else
            merge_back_target="$target_branch"
          fi

          # Dots are stripped (1.9.17 into 2.0.2 -> release-1917-into-202) to
          # satisfy the branch-name check used across the OpenCRVS repos.
          slug="${merge_back_target#release/}"
          mergeback_branch="merge-back/release-${version//./}-into-${slug//./}"

          echo "merge-back: $mergeback_branch -> $merge_back_target"
          echo "target_branch=$target_branch" >> $GITHUB_OUTPUT
          echo "merge_back_target=$merge_back_target" >> $GITHUB_OUTPUT
          echo "mergeback_branch=$mergeback_branch" >> $GITHUB_OUTPUT
          echo "base_branch=$base_branch" >> $GITHUB_OUTPUT

      # Full history is required so yarn can traverse the commit graph.
      - name: Checkout ${{ steps.get_base_branch.outputs.base_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_base_branch.outputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The target release branch must already exist; opencrvs-core resolves
      # which one it is. Fail before anything is created.
      - name: Verify the target release branch exists
        if: steps.get_base_branch.outputs.target_branch != 'master'
        run: |
          TARGET_BRANCH="${{ steps.get_base_branch.outputs.target_branch }}"
          if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" > /dev/null 2>&1; then
            echo "::error::$TARGET_BRANCH does not exist in this repository. Initialise ${TARGET_BRANCH#release/} here first, or re-run with the target_branch input set explicitly."
            exit 1
          fi

      - name: Check if release branch already exists
        id: check_branch
        run: |
          if git ls-remote --exit-code --heads origin "release/${{ inputs.version }}" > /dev/null 2>&1; then
            echo "Branch release/${{ inputs.version }} already exists, skipping creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Push the bump commits before any PR is opened, so both PRs contain
      # them. Skipped when a previous run already created the branch.
      - name: Create release branch and update version numbers and CHANGELOG
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "release/${{ inputs.version }}"

          # Bump package.json without creating a git tag.
          yarn version --new-version ${{ inputs.version }} --no-git-tag-version
          git add .
          git commit -m "chore: update version to ${{ inputs.version }}"

          # Prepend a "Release Candidate" section. sed drops the old
          # "# Changelog" header (lines 1-2) so it can be rewritten above it.
          sed -i '1,2d' CHANGELOG.md
          cp CHANGELOG.md COPY_CHANGELOG.md
          {
            echo "# Changelog"
            echo ""
            echo "## ${{ inputs.version }} Release Candidate"
            echo ""
            cat COPY_CHANGELOG.md
          } > CHANGELOG.md
          rm COPY_CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ inputs.version }} release candidate"

          git push origin "release/${{ inputs.version }}"

      # A copy of release/<version>. The dedicated branch means the commits that
      # resolve conflicts with the target stay off the release branch — whoever
      # merges the PR merges the target into this branch first, the same ritual
      # as a merge-back to develop.
      - name: Create merge-back branch
        run: |
          MERGEBACK_BRANCH="${{ steps.get_base_branch.outputs.mergeback_branch }}"
          RELEASE_BRANCH="release/${{ inputs.version }}"

          if git ls-remote --exit-code --heads origin "$MERGEBACK_BRANCH" > /dev/null 2>&1; then
            echo "Branch $MERGEBACK_BRANCH already exists, skipping."
            exit 0
          fi

          git fetch origin "$RELEASE_BRANCH"
          git checkout -b "$MERGEBACK_BRANCH" "origin/$RELEASE_BRANCH"
          git push origin "$MERGEBACK_BRANCH"

      # PR 1 — release/<version> → master
      #   The release PR, opened for the current (or a newer) channel only.
      #   Merging it ships the version to production and triggers the publish
      #   workflow. An older channel opens no release PR at all: it ships from
      #   its own release branch and reaches master through the channel above it.
      #
      # PR 2 — merge-back/release-<version-no-dots>-into-<target> → <target>
      #   develop for the current channel, the next unreleased patch of the
      #   channel above for an older one. Uses a dedicated branch so
      #   conflict-resolution commits stay off the release branch.
      #     - z=0 (base is develop): carries only the two bump commits, clean diff.
      #     - z>0 (base is a prior release branch): also backports any patch fixes.
      - name: Create Pull Requests
        run: |
          PR_BRANCH="release/${{ inputs.version }}"
          MERGEBACK_BRANCH="${{ steps.get_base_branch.outputs.mergeback_branch }}"
          MERGE_BACK_TARGET="${{ steps.get_base_branch.outputs.merge_back_target }}"

          # base, head, title, body. Leaves an already-open PR alone, so a
          # re-run can open just the missing one.
          create_pr() {
            local existing
            existing=$(gh pr list --head "$2" --base "$1" --state open --json number --jq '.[0].number // ""')
            if [ -n "$existing" ]; then
              echo "PR $2 → $1 already exists (#$existing), skipping."
              return
            fi
            gh pr create --base "$1" --head "$2" --title "$3" --body "$4"
          }

          if [ -f .github/TEMPLATES/RELEASE_PR_TEMPLATE.md ]; then
            BODY=$(cat .github/TEMPLATES/RELEASE_PR_TEMPLATE.md)
          else
            BODY=""
          fi

          if [ "$MERGE_BACK_TARGET" = "develop" ]; then
            create_pr "master" "$PR_BRANCH" "Release v${{ inputs.version }}" "$BODY"

            MERGEBACK_TITLE="chore: merge release v${{ inputs.version }} back to develop"
            MERGEBACK_BODY="Merge release branch back to develop to include version bump and changelog updates."
          else
            echo "Skipping the release PR to master: ${{ inputs.version }} is on an older channel."

            MERGEBACK_TITLE="chore: merge release v${{ inputs.version }} into $MERGE_BACK_TARGET"
            MERGEBACK_BODY="${BODY}

          ---

          > **Note:** \`${{ inputs.version }}\` is on an older channel than the one \`master\` tracks, so no release PR to \`master\` is opened. This PR carries the release up into \`$MERGE_BACK_TARGET\`, and it reaches \`master\` and \`develop\` through that channel's own release. Resolve conflicts by merging \`$MERGE_BACK_TARGET\` into this branch."
          fi

          create_pr "$MERGE_BACK_TARGET" "$MERGEBACK_BRANCH" "$MERGEBACK_TITLE" "$MERGEBACK_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A draft release gives the notes page something to write against. Its tag
      # is deleted right after; the publish workflow re-creates it when the
      # release PR merges. Skipped if the release already exists.
      - name: Create a draft release
        run: |
          TAG_NAME="v${{ inputs.version }}"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, skipping."
          else
            TITLE="OpenCRVS - $TAG_NAME"
            NOTES="Release notes for version ${{ inputs.version }}"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete the tag
        run: |
          TAG_NAME="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG_NAME" > /dev/null 2>&1; then
            git tag -d "$TAG_NAME" 2>/dev/null || true
            git push origin ":refs/tags/$TAG_NAME"
          else
            echo "Tag $TAG_NAME does not exist on remote, skipping."
          fi
