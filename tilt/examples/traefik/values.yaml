# Overwriting https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
namespaceOverride: "traefik"
logs:
  general:
    # "TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL", "PANIC"
    level: "INFO"
    # format: "common" # For local environment
    format: "json" # For server environment
  access:
    # -- To enable access logs
    enabled: true
ingressRoute:
  dashboard:
    enabled: false
# Be explicit that we only use CRDs, not ingress/gw support
providers: 
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: false
service:
  enabled: true
  single: false
  # OrbStack binds LoadBalancer service ports straight onto 127.0.0.1 on the Mac,
  # so the "web" entrypoint's exposedPort (80, chart default) becomes reachable
  # directly at http://opencrvs.localhost - no NodePort/port-forward needed.
  type: LoadBalancer

ports:
  web:
    port: 8000
    protocol: TCP
    # exposedPort is not set here - it defaults to 80 in the traefik chart,
    # which is what actually lands on host port 80 under OrbStack.